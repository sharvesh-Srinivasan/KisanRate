name: CI

on:
  push:
    branches-ignore:
      - main      # main handled by deploy.yml
  pull_request:
    branches:
      - main

jobs:
  # ── Server (Node/Express) ─────────────────────────────────────────────────
  lint-server:
    name: Lint & Test — Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  # ── Client (React) ────────────────────────────────────────────────────────
  lint-client:
    name: Lint & Test — Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (pass with no tests)
        run: npx react-scripts test --watchAll=false --passWithNoTests
        env:
          CI: true

  # ── ML (Python/FastAPI) ───────────────────────────────────────────────────
  lint-ml:
    name: Lint & Test — ML
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check — compile all Python files
        run: python -m py_compile main.py model.py

      - name: Check for obvious import errors
        run: python -c "import main; print('main.py OK')"
        env:
          DB_HOST: localhost
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: kisanrate
          DB_PORT: "3306"

  # ── Docker build validation ───────────────────────────────────────────────
  docker-build:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    needs: [lint-server, lint-client, lint-ml]
    strategy:
      matrix:
        include:
          - service: server
            context: ./server
          - service: ml
            context: ./ml
          - service: client
            context: ./client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          tags: kisanrate-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
